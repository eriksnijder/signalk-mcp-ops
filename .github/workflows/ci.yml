name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify:package
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:runtime
  native-auth:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        signalk: ['2.31.0', '2.35.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated native Signal K test runtime
        run: npm install --prefix "$RUNNER_TEMP/signalk-auth" --ignore-scripts --omit=optional --no-audit --no-fund "signalk-server@$SIGNALK_VERSION"
        env:
          SIGNALK_VERSION: ${{ matrix.signalk }}
      - run: npm run test:integration
        env:
          SIGNALK_TEST_SERVER_DIR: ${{ runner.temp }}/signalk-auth/node_modules/signalk-server
          SIGNALK_TEST_SERVER_VERSION: ${{ matrix.signalk }}
